name: "Sileo: record demo video"

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    runs-on: macos-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Xcode Setup
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Resolve SPM dependencies
        run: |
          xcodebuild -resolvePackageDependencies -project Sileo.xcodeproj -scheme Sileo -derivedDataPath build

      - name: Patch Alderis for Xcode 26 SDK
        run: |
          # Alderis declares `var tab: ColorPickerTab` on a UIViewController subclass,
          # which collides with UIViewController.tab (UITab?) introduced in the iOS 18 SDK.
          # Rename the property in the resolved checkout (no fork needed).
          # SPM checkouts are read-only -> chmod first.
          chmod -R u+w build/SourcePackages/checkouts/Alderis
          python3 - <<'EOF'
          p = "build/SourcePackages/checkouts/Alderis/Alderis/ColorPickerInnerViewController.swift"
          t = open(p).read()
          t = t.replace("\tvar tab: ColorPickerTab {", "\tvar pickerTab: ColorPickerTab {")
          t = t.replace("\t\ttab = configuration.initialTab", "\t\tpickerTab = configuration.initialTab")
          open(p, "w").write(t)
          assert "pickerTab: ColorPickerTab" in t
          print("Alderis patched")
          EOF

      - name: Build Sileo for Simulator
        run: |
          xcodebuild -project Sileo.xcodeproj -scheme Sileo -configuration Release -derivedDataPath build -destination 'generic/platform=iOS Simulator' CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO IPHONEOS_DEPLOYMENT_TARGET=12.0

      - name: Boot simulator and record
        run: |
          set -x
          # Pick an available iPhone simulator (or create one)
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          devs=[x for vs in d['devices'].values() for x in vs if 'iPhone' in x.get('name','') and x.get('isAvailable')]
          print(devs[0]['udid'] if devs else '')
          ")
          if [ -z "$UDID" ]; then
            RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          rs=[r['identifier'] for r in d['runtimes'] if 'iOS' in r['name'] and r['isAvailable']]
          print(rs[-1])
          ")
            DEVTYPE=$(xcrun simctl list devicetypes -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          dts=[t['identifier'] for t in d['devicetypes'] if 'iPhone-16' in t['identifier']]
          print(dts[0] if dts else d['devicetypes'][0]['identifier'])
          ")
            UDID=$(xcrun simctl create "SileoDemo" "$DEVTYPE" "$RUNTIME")
          fi
          echo "Using simulator $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          APP=build/Build/Products/Release-iphonesimulator/Sileo.app
          ls -d "$APP"
          xcrun simctl install "$UDID" "$APP"
          # Start recording, then launch the app
          xcrun simctl io "$UDID" recordVideo --codec=h264 sileo-demo.mp4 &
          REC_PID=$!
          sleep 3
          xcrun simctl launch "$UDID" org.coolstar.SileoStore || true
          sleep 25
          kill -INT $REC_PID || true
          wait $REC_PID || true
          ls -la sileo-demo.mp4

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: Sileo-demo-video
          path: sileo-demo.mp4
