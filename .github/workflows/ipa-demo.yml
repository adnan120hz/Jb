name: "Sileo: build IPA"

on:
  push:
    branches:
      - demo
    paths:
      - "Sileo/**"
      - ".github/workflows/ipa-demo.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Xcode Setup
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build Sileo app
        run: |
          xcodebuild -project Sileo.xcodeproj -scheme Sileo -configuration Release -derivedDataPath build -destination 'generic/platform=iOS' CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO

      - name: Package Sileo.ipa
        run: |
          rm -rf Payload Sileo.ipa
          mkdir Payload
          cp -r "build/Build/Products/Release-iphoneos/Sileo.app" Payload/
          zip -qr Sileo.ipa Payload
          rm -rf Payload
          ls -la Sileo.ipa

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sileo-ipa
          path: Sileo.ipa
