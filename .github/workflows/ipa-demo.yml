name: "Sileo: build IPA"

on:
  push:
    branches:
      - demo
    paths:
      - "Sileo/**"
      - ".github/workflows/ipa-demo.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Xcode Setup
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Resolve SPM dependencies
        run: |
          xcodebuild -resolvePackageDependencies -project Sileo.xcodeproj -scheme Sileo -derivedDataPath build

      - name: Patch Alderis for Xcode 26 SDK
        run: |
          # Alderis declares `var tab: ColorPickerTab` on a UIViewController subclass,
          # which collides with UIViewController.tab (UITab?) introduced in the iOS 18 SDK.
          # Rename the property in the resolved checkout (no fork needed).
          # SPM checkouts are read-only -> chmod first.
          chmod -R u+w build/SourcePackages/checkouts/Alderis
          python3 - <<'EOF'
          p = "build/SourcePackages/checkouts/Alderis/Alderis/ColorPickerInnerViewController.swift"
          t = open(p).read()
          t = t.replace("\tvar tab: ColorPickerTab {", "\tvar pickerTab: ColorPickerTab {")
          t = t.replace("\t\ttab = configuration.initialTab", "\t\tpickerTab = configuration.initialTab")
          open(p, "w").write(t)
          assert "pickerTab: ColorPickerTab" in t
          print("Alderis patched")
          EOF

      - name: Build Sileo app
        run: |
          xcodebuild -project Sileo.xcodeproj -scheme Sileo -configuration Release -derivedDataPath build -destination 'generic/platform=iOS' CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO IPHONEOS_DEPLOYMENT_TARGET=12.0

      - name: Package Sileo.ipa
        run: |
          rm -rf Payload Sileo.ipa
          mkdir Payload
          cp -r "build/Build/Products/Release-iphoneos/Sileo.app" Payload/
          zip -qr Sileo.ipa Payload
          rm -rf Payload
          ls -la Sileo.ipa

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sileo-ipa
          path: Sileo.ipa
